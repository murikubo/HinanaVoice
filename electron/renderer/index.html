<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hinana Voice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="presence" aria-hidden="true"></span>
          <span>Hinana Voice</span>
        </div>
        <div class="top-actions">
          <span id="status" class="status">연결 준비 중…</span>
          <button id="settingsButton" class="icon-button" type="button" aria-label="설정 열기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Zm8-3.5c0-.5-.04-1-.13-1.47l2.02-1.58-2-3.46-2.5 1A8.2 8.2 0 0 0 14.87 5L14.5 2h-5l-.38 3a8.2 8.2 0 0 0-2.5 1.48l-2.5-1-2 3.46 2.02 1.58A8.1 8.1 0 0 0 4 12c0 .5.04 1 .13 1.47L2.1 15.05l2 3.46 2.5-1A8.2 8.2 0 0 0 9.13 19l.37 3h5l.38-3a8.2 8.2 0 0 0 2.5-1.48l2.5 1 2-3.46-2.02-1.58c.09-.48.13-.97.13-1.48Z"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
          <div class="bubble">야하~ 프로듀서, 히나나예요! 뭐부터 시작해볼까요?</div>
          <div class="message-meta">VOICEPEAK · Koharu Rikka</div>
        </article>
      </section>

      <form id="composer" class="composer">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="10000"
          placeholder="메시지 보내기…"
          aria-label="메시지 입력"
        ></textarea>
        <button id="sendButton" class="send-button" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 3 18 9-18 9 3.5-7.5L15 12l-8.5-1.5L3 3Z"/>
          </svg>
          <span>전송</span>
        </button>
      </form>
    </main>

    <dialog id="settingsDialog" class="settings-dialog">
      <form id="settingsForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <h2>연결 설정</h2>
            <p>API 키는 저장하지 않고 현재 실행 중에만 사용합니다.</p>
          </div>
          <button id="closeSettings" class="icon-button" type="button" aria-label="설정 닫기">×</button>
        </div>

        <label>
          <span>OpenAI API 키</span>
          <input id="apiKey" type="password" autocomplete="off" placeholder="sk-… 또는 환경변수 사용" />
        </label>
        <label>
          <span>VOICEPEAK 실행 파일</span>
          <input id="voicepeak" type="text" />
        </label>
        <div class="field-grid">
          <label>
            <span>화자</span>
            <select id="narrator"><option>Koharu Rikka</option></select>
          </label>
          <label>
            <span>오디오 출력</span>
            <select id="device"><option value="">장치를 불러오는 중…</option></select>
          </label>
        </div>
        <div class="field-grid compact">
          <label>
            <span>속도</span>
            <input id="speed" type="number" min="50" max="200" />
          </label>
          <label>
            <span>피치</span>
            <input id="pitch" type="number" min="-300" max="300" />
          </label>
        </div>
        <div id="settingsMessage" class="settings-message"></div>
        <div id="routeHelp" class="route-help"></div>
        <div class="dialog-actions">
          <button id="probeButton" class="secondary-button" type="button">장치 새로고침</button>
          <button class="primary-button" value="save" type="submit">저장</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
